kind = "web"
previewPath = "/"
title = "Dispute Defense Agent"
description = "A dispute-review dashboard for small online sellers. It keeps simulated demo cases separate from read-only PayPal Sandbox dispute data; it does not use production PayPal data, AI recommendations, refunds, or evidence submissions."
version = "1.0.0"
id = "artifacts/dispute-defense-agent"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25916

[services.development]
run = "pnpm --filter @workspace/dispute-defense-agent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dispute-defense-agent", "run", "build" ]
serve = "static"
publicDir = "artifacts/dispute-defense-agent/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25916"
BASE_PATH = "/"
