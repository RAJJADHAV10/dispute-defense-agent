openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: disputes
    description: Simulated dispute case operations
  - name: dashboard
    description: Demo dashboard summary and activity
  - name: paypal
    description: Read-only PayPal Sandbox diagnostics and disputes
  - name: ai-analysis
    description: AI analysis of simulated demo disputes only
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: apiHealthCheck
      tags: [health]
      summary: API health check
      description: Returns server health status at the public API health route
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /disputes:
    get:
      operationId: getDisputes
      tags: [disputes]
      summary: List demo disputes
      description: Returns the clearly simulated in-memory dispute cases
      responses:
        "200":
          description: Dispute cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dispute"
  /disputes/{id}:
    get:
      operationId: getDispute
      tags: [disputes]
      summary: Get a demo dispute
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dispute case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "404":
          description: Dispute not found
  /demo/disputes/{id}/analyze:
    post:
      operationId: analyzeDemoDispute
      tags: [ai-analysis]
      summary: Analyze a simulated demo dispute
      description: Returns an informational AI analysis of a server-side simulated case; no payment actions are performed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AI analysis of a simulated demo dispute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeAnalysis"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeAnalysisError"
        "404":
          description: Simulated dispute not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeAnalysisError"
        "502":
          description: AI provider returned an error or an invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeAnalysisError"
        "503":
          description: AI provider is not configured or temporarily rate-limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeAnalysisError"
        "504":
          description: AI provider request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeAnalysisError"
  /dashboard:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activity:
    get:
      operationId: getActivity
      tags: [dashboard]
      summary: Get demo activity log
      responses:
        "200":
          description: Activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"
  /paypal/status:
    get:
      operationId: getPayPalStatus
      tags: [paypal]
      summary: Check PayPal Sandbox authentication
      description: Safely reports whether server-side PayPal Sandbox authentication works
      responses:
        "200":
          description: PayPal Sandbox connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayPalStatus"
  /paypal/disputes:
    get:
      operationId: getPayPalDisputes
      tags: [paypal]
      summary: List PayPal Sandbox disputes
      description: Returns PayPal disputes or an explicitly labelled simulated fallback
      responses:
        "200":
          description: PayPal Sandbox disputes or labelled demo fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayPalDisputesResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Dispute:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        customerName:
          type: string
        amount:
          type: number
        currency:
          type: string
        reason:
          type: string
        responseDeadline:
          type: string
          format: date-time
        status:
          type: string
          enum: [needs_response, under_review, resolved]
        resolution:
          type: ["string", "null"]
        recommendedAction:
          type: string
        actionDisclaimer:
          type: string
        openedAt:
          type: string
          format: date-time
        orderDescription:
          type: string
        customerMessage:
          type: string
        evidenceChecklist:
          type: array
          items:
            type: string
      required:
        - id
        - orderId
        - customerName
        - amount
        - currency
        - reason
        - responseDeadline
        - status
        - resolution
        - recommendedAction
        - actionDisclaimer
        - openedAt
        - orderDescription
        - customerMessage
        - evidenceChecklist
    DisputeAnalysisModelContent:
      type: object
      additionalProperties: false
      properties:
        missingOrWeakEvidence:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 240
        recommendedEvidenceChecklist:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 240
        recommendation:
          type: string
          enum: [contest, refund_for_seller_review, gather_more_evidence]
        explanation:
          type: string
          maxLength: 2000
        confidence:
          type: string
          enum: [low, medium, high]
        confidenceExplanation:
          type: string
          maxLength: 1000
      required:
        - missingOrWeakEvidence
        - recommendedEvidenceChecklist
        - recommendation
        - explanation
        - confidence
        - confidenceExplanation
    DisputeAnalysis:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
          enum: [simulated_demo]
        disputeId:
          type: string
        disputeReason:
          type: string
        disputedAmount:
          type: number
        currency:
          type: string
        evidenceCurrentlyAvailable:
          type: array
          items:
            type: string
        evidenceAvailabilityNote:
          type: string
        analysis:
          $ref: "#/components/schemas/DisputeAnalysisModelContent"
        responseDeadline:
          type: ["string", "null"]
          format: date-time
        disclaimer:
          type: string
      required:
        - source
        - disputeId
        - disputeReason
        - disputedAmount
        - currency
        - evidenceCurrentlyAvailable
        - evidenceAvailabilityNote
        - analysis
        - responseDeadline
        - disclaimer
    DisputeAnalysisError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - invalid_request
            - dispute_not_found
            - openai_not_configured
            - openai_authentication_failed
            - openai_rate_limited
            - openai_quota_exceeded
            - openai_unavailable
            - invalid_openai_response
            - openai_timeout
      required:
        - error
        - code
    DashboardSummary:
      type: object
      properties:
        openDisputes:
          type: integer
        moneyAtRisk:
          type: number
        upcomingDeadlines:
          type: integer
        casesResolved:
          type: integer
      required:
        - openDisputes
        - moneyAtRisk
        - upcomingDeadlines
        - casesResolved
    ActivityEntry:
      type: object
      properties:
        id:
          type: string
        disputeId:
          type: string
        title:
          type: string
        description:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
        - id
        - disputeId
        - title
        - description
        - timestamp
    PayPalStatus:
      type: object
      properties:
        configured:
          type: boolean
        authenticated:
          type: boolean
        status:
          type: string
          enum: [connected, not_configured, authentication_failed, unavailable]
        message:
          type: string
        checkedAt:
          type: string
          format: date-time
      required:
        - configured
        - authenticated
        - status
        - message
        - checkedAt
    PayPalDisputeSummary:
      type: object
      properties:
        id:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        reason:
          type: ["string", "null"]
        amount:
          type: ["string", "null"]
        currencyCode:
          type: ["string", "null"]
        createdAt:
          type: ["string", "null"]
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time
        responseDeadline:
          type: ["string", "null"]
          format: date-time
        lifecycleStage:
          type: ["string", "null"]
        channel:
          type: ["string", "null"]
        isSimulated:
          type: boolean
      required:
        - id
        - status
        - reason
        - amount
        - currencyCode
        - createdAt
        - updatedAt
        - responseDeadline
        - lifecycleStage
        - channel
        - isSimulated
    PayPalDisputesResult:
      type: object
      properties:
        source:
          type: string
          enum: [paypal_sandbox, simulated_fallback]
        status:
          type: string
          enum: [connected, fallback]
        isSimulated:
          type: boolean
        message:
          type: string
        errorCode:
          type: ["string", "null"]
          enum:
            - not_configured
            - authentication_failed
            - paypal_api_error
            - network_error
            - invalid_response
            - null
        total:
          type: integer
        disputes:
          type: array
          items:
            $ref: "#/components/schemas/PayPalDisputeSummary"
      required:
        - source
        - status
        - isSimulated
        - message
        - errorCode
        - total
        - disputes

